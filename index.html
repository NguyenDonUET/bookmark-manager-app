<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/assets/images/favicon-32x32.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Bookmark manager app" />
    <title>Bookmark Manager</title>
    <script>
      // Avoid theme flash before React mounts (mirrors theme-store persist shape).
      try {
        var raw = localStorage.getItem('theme-store');
        if (raw) {
          var parsed = JSON.parse(raw);
          if (parsed && parsed.state && parsed.state.theme === 'dark') {
            document.documentElement.classList.add('dark');
          }
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
